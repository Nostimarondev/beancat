<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEANCAT — Total Supply</title>

  <link rel="icon" type="image/png" href="/icon.png" />
  <!-- Import the main CSS to keep all the variables and neon styles -->
  <link rel="stylesheet" href="../style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }

    /* Background elements */
    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
      z-index: -2;
    }

    .overlay-grain {
      position: absolute;
      inset: 0;
      background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.05;
      z-index: -1;
      pointer-events: none;
    }

    /* Centered Glass Panel */
    .supply-container {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--neon-green);
      border-radius: 20px;
      padding: 60px;
      text-align: center;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.1), inset 0 0 20px rgba(0, 255, 65, 0.05);
      z-index: 10;
      max-width: 90vw;
      width: 800px;
      transition: all 0.3s ease;
      animation: float 6s ease-in-out infinite;
    }

    .supply-container:hover {
      box-shadow: 0 0 60px rgba(0, 255, 65, 0.2), inset 0 0 30px rgba(0, 255, 65, 0.1);
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: #fff;
      margin-bottom: 30px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .number {
      font-family: var(--font-display);
      font-size: 4rem;
      font-weight: 900;
      color: var(--neon-green);
      text-shadow: 0 0 20px var(--neon-green);
      margin: 20px 0;
      word-wrap: break-word;
      min-height: 100px;
      /* space while loading */
    }

    .loading-text {
      font-size: 1.2rem;
      opacity: 0.7;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }
    }

    .back-btn {
      display: inline-block;
      margin-top: 40px;
      color: #fff;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 10px 20px;
      border: 1px solid var(--neon-green);
      border-radius: 30px;
      transition: all 0.3s ease;
      background: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .back-btn:hover {
      background: rgba(0, 255, 65, 0.1);
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
      color: var(--neon-green);
    }

    @media (max-width: 768px) {
      .supply-container {
        padding: 40px 20px;
      }

      .title {
        font-size: 1.8rem;
      }

      .number {
        font-size: 3rem;
      }
    }
  </style>
</head>

<body>

  <!-- Try to use the same background video if it exists in public -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="/BG_02.mp4" type="video/mp4">
  </video>
  <div class="overlay-grain"></div>

  <div class="supply-container">
    <h1 class="title">Total Supply</h1>

    <div id="supply-number" class="number">
      <span class="loading-text">SYNCING_DATA...</span>
    </div>

    <a href="/" class="back-btn">RETURN TO TERMINAL</a>
  </div>

  <script>
    // Automatically fetch the pure number from our API when the page loads
    async function fetchSupply() {
      const supplyElement = document.getElementById('supply-number');

      try {
        const response = await fetch('/api/total-supply');

        if (!response.ok) {
          throw new Error('Network error');
        }

        const text = await response.text();
        const number = parseFloat(text);

        if (isNaN(number)) {
          throw new Error('Invalid data');
        }

        // Format the number with commas (e.g. 1,000,000) for humans
        const formattedNumber = new Intl.NumberFormat('en-US').format(number);

        // Add a cool glitch reveal effect
        supplyElement.innerHTML = formattedNumber;
        supplyElement.style.animation = 'none';

      } catch (error) {
        console.error('Failed to load supply:', error);
        supplyElement.innerHTML = '<span style="color: #ff3333; font-size: 1.5rem;">CONNECTION_FAILED</span>';
        supplyElement.style.textShadow = '0 0 20px #ff3333';
      }
    }

    // Small delay for aesthetic purposes
    setTimeout(fetchSupply, 800);
  </script>
</body>

</html>
